name: Publish Cloud Admin Web
# Explicitly select workflow publishing so branch/Jekyll builds cannot replace the app.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
  workflow_run:
    workflows: ['Publish PC Club ZIP']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - name: Select GitHub Actions as the Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow; then
            echo "::warning::Automatic Pages source update is unavailable. The repository root also contains the compiled app; public delivery verification remains required."
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Mark the web artifact for delivery verification
        run: |
          touch dist/web/.nojekyll
          python - <<'PYCODE'
          import re
          from pathlib import Path
          html = Path('dist/web/index.html').read_text()
          Path('dist/web/pcclub-build.txt').write_text(re.search(r'assets/[^"\s]+\.js', html)[0])
          PYCODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - name: Deploy web console
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public website serves this app build
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PYCODE'
          import os, time, urllib.request
          base = os.environ['SITE_URL'].rstrip('/') + '/'
          from pathlib import Path
          from urllib.parse import urljoin
          expected = Path('dist/web/pcclub-build.txt').read_text().strip()
          for attempt in range(12):
              try:
                  nonce = str(int(time.time()))
                  build = urllib.request.urlopen(base + 'pcclub-build.txt?build=' + nonce, timeout=15).read().decode().strip()
                  page = urllib.request.urlopen(base + '?build=' + nonce, timeout=15).read().decode()
                  if build == expected and expected in page and 'id="root"' in page and 'type="module"' in page:
                      import re
                      module = re.search(r'<script[^>]+src="([^"]+)"', page)
                      if not module:
                          raise ValueError('Missing app module')
                      urllib.request.urlopen(urljoin(base, module[1]), timeout=15).read(100)
                      print('Public Pages URL serves the compiled PC Club app:', base + '#/admin')
                      break
                  print('Waiting for the compiled app to reach Pages CDN', attempt + 1)
              except Exception as error:
                  print('Waiting for Pages CDN:', str(error))
              time.sleep(5)
          else:
              raise SystemExit('Pages is not serving this app build; deployment must not be reported as verified.')
          PYCODE
