name: Validate
on:
  push:
    paths-ignore: ['.github/workflows/publish.yml', '.github/workflows/check.yml', '.github/workflows/pages.yml']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # The browser flow test targets the retired 1.0 local server UI; cloud builds skip it.
  windows-installers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build Windows Alt-F4 guard
        shell: cmd
        run: cl /nologo /EHsc /O2 /W4 native\keyguard.cpp /Fe:build\pcclub-keyguard.exe /Fo:build\keyguard.obj user32.lib
      - run: npm run build
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: PC-Club-Windows-Installers
          path: release/*/*Setup*.exe
