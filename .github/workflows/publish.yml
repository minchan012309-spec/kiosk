name: Publish PC Club ZIP
# Publish 1.3 with QR/barcode entry tickets and coin exchange.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install build dependencies
        run: npm ci
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build Windows Alt-F4 guard
        shell: cmd
        run: cl /nologo /EHsc /O2 /W4 native\keyguard.cpp /Fe:build\pcclub-keyguard.exe /Fo:build\keyguard.obj user32.lib
      - name: Build cloud console and launcher
        run: npm run build
      - name: Create installers with custom Windows icons
        shell: bash
        run: |
          if ! npm run dist:win > package.log 2>&1; then
            tail -n 40 package.log
            python -c "from pathlib import Path; s=Path('package.log').read_text()[-6000:]; print('::error::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
          cat package.log
      - name: Package applications and separate Supabase setup files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/Supabase-Setup -Force | Out-Null
          Copy-Item supabase/migrations/001_club.sql release/Supabase-Setup/001_club.sql
          Copy-Item supabase/002_first_owner.sql release/Supabase-Setup/002_first_owner.sql
          Copy-Item supabase/migrations/003_layout_media_restart.sql release/Supabase-Setup/003_layout_media_restart.sql
          Copy-Item supabase/migrations/004_tickets.sql release/Supabase-Setup/004_tickets.sql
          Copy-Item docs/UPDATE-1.3-KO.md release/Supabase-Setup/UPDATE-1.3-KO.md
          Copy-Item docs/UPDATE-1.2-KO.md release/Supabase-Setup/UPDATE-1.2-KO.md
          Copy-Item supabase/functions/club-admin/index.ts release/Supabase-Setup/club-admin.ts
          Copy-Item docs/SUPABASE-SETUP-KO.md release/Supabase-Setup/SETUP-KO.md
          Compress-Archive -Path release/Supabase-Setup/* -DestinationPath release/Supabase-Setup.zip -CompressionLevel Optimal
          New-Item -ItemType Directory -Path release/Delivery -Force | Out-Null
          Copy-Item release/server/*Setup*.exe release/Delivery/
          Copy-Item release/station/*Setup*.exe release/Delivery/
          Copy-Item release/Supabase-Setup release/Delivery/ -Recurse
          Compress-Archive -Path release/Delivery/* -DestinationPath release/PC-Club-Installers.zip -CompressionLevel NoCompression
      - name: Package unzip-and-run applications
        shell: pwsh
        run: |
          foreach ($item in @(@{Role='server'; Name='Admin'}, @{Role='station'; Name='Station'})) {
            $folder = "release/PC-Club-$($item.Name)-Portable"
            New-Item -ItemType Directory -Path $folder -Force | Out-Null
            Copy-Item "release/$($item.Role)/win-unpacked/*" $folder -Recurse
            Copy-Item docs/PORTABLE-KO.md "$folder/사용방법.md"
            Copy-Item docs/UPDATE-1.3-KO.md "$folder/UPDATE-1.3-KO.md"
            Compress-Archive -Path $folder -DestinationPath "release/PC-Club-$($item.Name)-Portable.zip" -CompressionLevel Optimal
          }
          New-Item -ItemType Directory -Path release/PC-Club-Portable -Force | Out-Null
          Copy-Item release/PC-Club-Station-Portable release/PC-Club-Portable/Station -Recurse
          Copy-Item release/PC-Club-Admin-Portable release/PC-Club-Portable/Server -Recurse
          Copy-Item docs/PORTABLE-KO.md release/PC-Club-Portable/사용방법.md
          Compress-Archive -Path release/PC-Club-Portable/* -DestinationPath release/PC-Club-Portable.zip -CompressionLevel Optimal
          Compress-Archive -Path windows-lockdown/* -DestinationPath release/PC-Club-Windows-Lockdown.zip -CompressionLevel Optimal
      - name: Publish cloud release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          target_commitish: ${{ github.sha }}
          name: PC Club 1.3.1 · 입장권
          fail_on_unmatched_files: true
          files: |
            release/PC-Club-Installers.zip
            release/PC-Club-Portable.zip
            release/PC-Club-Admin-Portable.zip
            release/PC-Club-Station-Portable.zip
            release/PC-Club-Windows-Lockdown.zip
            release/Supabase-Setup.zip
            release/Supabase-Setup/001_club.sql
            release/Supabase-Setup/002_first_owner.sql
            release/Supabase-Setup/003_layout_media_restart.sql
            release/Supabase-Setup/004_tickets.sql
            release/Supabase-Setup/UPDATE-1.3-KO.md
            release/Supabase-Setup/UPDATE-1.2-KO.md
            release/Supabase-Setup/club-admin.ts
            release/Supabase-Setup/SETUP-KO.md
          body: |
            ## 1.3.1 · QR/바코드 입장권 + 코인
            1.3.1: 관리자 앱에서 게임 실행 파일 선택, 행사 진행자(코인 추가·차감 전용) 계정 프리셋, 코인 순위표, 키오스크 빈자리 표시.
            **기존 사용자: Supabase SQL Editor에서 004_tickets.sql을 먼저 실행하고 모든 Station/Admin을 업데이트하세요.** 자세한 내용은 UPDATE-1.3-KO.md.

            - 관리자에서 8자리 입장권 생성, QR·바코드 SVG(배경 투명·흰색 코드) ZIP 다운로드
            - 입구 키오스크: 이름·학번 + 입장권 번호 등록 / PC: 입장권 번호로 바로 시작
            - 코인은 입장권에 저장: 시간 연장·간식 주문, 피지컬 부스에서 폰 QR 스캔으로 지급
            - 환전소: 남은 코인 간식 교환 후 반납·초기화로 입장권 재사용

            설치형: PC-Club-Installers.zip · 무설치형: PC-Club-Portable.zip (Station / Server 폴더)
            폰 관리자: https://minchan012309-spec.github.io/kiosk/#/admin
            설치 파일은 미서명입니다. 실제 Windows·Supabase 실기 검증은 하지 않았습니다.
