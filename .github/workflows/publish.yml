name: Publish PC Club ZIP
# Publish installed and unzip-and-run Windows distributions together.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install build dependencies
        run: npm ci
      - name: Build cloud console and launcher
        run: npm run build
      - name: Create installers with custom Windows icons
        shell: bash
        run: |
          if ! npm run dist:win > package.log 2>&1; then
            tail -n 40 package.log
            python -c "from pathlib import Path; s=Path('package.log').read_text()[-6000:]; print('::error::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
          cat package.log
      - name: Package applications and separate Supabase setup files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/Supabase-Setup -Force | Out-Null
          Copy-Item supabase/migrations/001_club.sql release/Supabase-Setup/001_club.sql
          Copy-Item supabase/002_first_owner.sql release/Supabase-Setup/002_first_owner.sql
          Copy-Item supabase/functions/club-admin/index.ts release/Supabase-Setup/club-admin.ts
          Copy-Item docs/SUPABASE-SETUP-KO.md release/Supabase-Setup/SETUP-KO.md
          Compress-Archive -Path release/Supabase-Setup/* -DestinationPath release/Supabase-Setup.zip -CompressionLevel Optimal
          New-Item -ItemType Directory -Path release/Delivery -Force | Out-Null
          Copy-Item release/server/*Setup*.exe release/Delivery/
          Copy-Item release/station/*Setup*.exe release/Delivery/
          Copy-Item release/Supabase-Setup release/Delivery/ -Recurse
          Compress-Archive -Path release/Delivery/* -DestinationPath release/PC-Club-Installers.zip -CompressionLevel NoCompression
      - name: Package unzip-and-run applications
        shell: pwsh
        run: |
          foreach ($item in @(@{Role='server'; Name='Admin'}, @{Role='station'; Name='Station'})) {
            $folder = "release/PC-Club-$($item.Name)-Portable"
            New-Item -ItemType Directory -Path $folder -Force | Out-Null
            Copy-Item "release/$($item.Role)/win-unpacked/*" $folder -Recurse
            Copy-Item docs/PORTABLE-KO.md "$folder/사용방법.md"
            Compress-Archive -Path $folder -DestinationPath "release/PC-Club-$($item.Name)-Portable.zip" -CompressionLevel Optimal
          }
          Compress-Archive -Path windows-lockdown/* -DestinationPath release/PC-Club-Windows-Lockdown.zip -CompressionLevel Optimal
      - name: Publish cloud release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          target_commitish: ${{ github.sha }}
          name: PC Club 1.1.0 · Cloud
          fail_on_unmatched_files: true
          files: |
            release/PC-Club-Installers.zip
            release/PC-Club-Admin-Portable.zip
            release/PC-Club-Station-Portable.zip
            release/PC-Club-Windows-Lockdown.zip
            release/Supabase-Setup.zip
            release/Supabase-Setup/001_club.sql
            release/Supabase-Setup/002_first_owner.sql
            release/Supabase-Setup/club-admin.ts
            release/Supabase-Setup/SETUP-KO.md
          body: |
            Supabase 클라우드 버전입니다. 로컬 서버는 실행하지 않습니다.

            1. Supabase-Setup.zip의 SQL·최초 소유자·Edge Function 설정을 먼저 완료하세요.
            2. 설치형은 PC-Club-Installers.zip, 무설치형은 Admin-Portable.zip / Station-Portable.zip을 선택하세요.
            3. 무설치형은 ZIP 전체를 풀고 폴더 안의 PC Club Admin.exe / PC Club Station.exe를 실행하세요. PC·키오스크 등록은 동일합니다.
            4. 사용자 PC에서 관리자 인증 후 실제 게임 실행 파일을 선택하세요.

            폰 관리자: https://minchan012309-spec.github.io/kiosk/#/admin
            관리자 여러 계정·권한, 여러 종료 비밀번호, 이름·로고·테마 설정을 지원합니다.
            4~6자리 비밀번호 입장, 대기/감사 화면, 앱 내 주문 팝업, Alt+F4 차단·알림 및 새 CRT 아이콘을 포함합니다.

            SQL·Edge Function을 사용자의 프로젝트에 자동 적용하지 않습니다.
            추가 전체 테스트는 실행하지 않았고 실제 Windows 게임 호환성은 미확인입니다. 설치 파일은 미서명입니다.
