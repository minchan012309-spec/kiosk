<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PC CLUB 작품 안내 양식</title>
<style>
@font-face { font-family: "RoundedFixedsys"; src: url("__FONT_DUNGGEUNMO__") format("woff"); font-display: block; }
@font-face { font-family: "Yangjin"; src: url("__FONT_YANGJIN__") format("woff"); font-display: block; }

:root {
  --ui-bg: #0b0f0a; --ui-panel: #1c2519; --ui-line: #38492e; --ui-text: #eef7e6; --ui-muted: #abbc9b; --lime: #ceff00;
  font-family: "RoundedFixedsys", "Malgun Gothic", monospace;
  color: var(--ui-text); background: var(--ui-bg);
}
* { box-sizing: border-box; }
body { margin: 0; background-color: var(--ui-bg); background-image: radial-gradient(#ffffff10 1px, transparent 1px); background-size: 14px 14px; }
button, input { font: inherit; color: inherit; }

/* ---------- Toolbar (screen only) ---------- */
.toolbar { position: sticky; top: 0; z-index: 20; background: var(--ui-panel); border-bottom: 2px solid #000; box-shadow: 0 3px 0 #000; }
.tb-row { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.tb-brand { display: flex; align-items: center; gap: 8px; font-family: "Yangjin", "RoundedFixedsys", sans-serif; font-size: 18px; margin-right: auto; }
.tb-brand i { font-style: normal; font-family: "RoundedFixedsys", monospace; font-size: 11px; background: var(--lime); color: #172009; border: 2px solid #253b0a; padding: 3px 5px; box-shadow: 2px 2px 0 #000; }
.tb-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn { cursor: pointer; border: 2px solid #000; border-radius: 0; background: #2a3526; padding: 8px 12px; box-shadow: 3px 3px 0 #000; font-size: 14px; }
.btn:hover { background: #36442f; }
.btn:active { transform: translate(3px,3px); box-shadow: none; }
.btn:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.btn.primary { background: var(--lime); color: #172009; border-color: #253b0a; }
.btn.primary:hover { background: #e2ff7a; }
.seg { display: flex; border: 2px solid var(--ui-line); }
.seg label { text-align: center; padding: 7px 10px; cursor: pointer; font-size: 13px; color: var(--ui-muted); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--lime); color: #172009; }
.seg label:has(input:focus-visible) { outline: 2px solid var(--lime); outline-offset: 2px; }
.tb-info { border-top: 2px dashed var(--ui-line); }
.tb-info .tb-row { padding-top: 8px; padding-bottom: 8px; font-size: 13px; color: var(--ui-muted); gap: 6px 18px; }
.tb-info b { color: var(--lime); font-weight: 400; }
.tb-info .fname b { color: var(--ui-text); }
.status { display: none; width: 100%; padding: 8px 10px; border: 2px solid #ff8fa3; color: #ffb3c0; font-size: 13px; line-height: 1.5; }
.status.show { display: block; }

.stage { padding: 26px 16px 70px; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
.sheet-frame { position: relative; }
.sheet-scale { transform-origin: top left; position: absolute; top: 0; left: 0; box-shadow: 8px 8px 0 #000; }
.help { max-width: 794px; margin: 22px auto 0; color: var(--ui-muted); font-size: 13px; line-height: 1.8; border: 2px dashed var(--ui-line); padding: 12px 16px; }
.help b { color: var(--lime); font-weight: 400; }
.help ol { margin: 4px 0 0; padding-left: 20px; }

/* ---------- A4 sheet ---------- */
.sheet {
  --s: 1;
  --bg: #11170f; --panel: #1c2519; --frame: #000; --line: #38492e; --ink: #eef7e6; --muted: #abbc9b;
  --accent: #ceff00; --accent-ink: #172009; --title-shadow: #496600; --shadow: #000; --chip: #0c110b; --dot: #ffffff0d; --edit: #ceff00;
  width: 210mm; height: 297mm; overflow: hidden; position: relative;
  background-color: var(--bg); color: var(--ink);
  background-image: radial-gradient(var(--dot) 0.35mm, transparent 0.4mm); background-size: 5mm 5mm;
  font-family: "RoundedFixedsys", "Malgun Gothic", monospace;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.sheet.light {
  --bg: #f7f9ef; --panel: #ffffff; --frame: #20271d; --line: #b9c6a6; --ink: #1c2418; --muted: #536249;
  --title-shadow: #ceff00; --shadow: #dbe4c9; --chip: #f0f6df; --dot: #20271d12; --edit: #4d6400;
}
.sheet-inner { position: absolute; inset: 11mm 12mm 10mm; display: flex; flex-direction: column; gap: calc(var(--s) * 4mm); }

/* editable fields */
[data-k], .cell { outline: none; border-radius: 0; cursor: text; min-width: 6mm; white-space: pre-wrap; overflow-wrap: anywhere; }
[data-k]:empty::before, .cell:empty::before { content: attr(data-ph); color: var(--muted); opacity: 0.55; pointer-events: none; }
.editing [data-k]:hover, .editing .cell:hover { box-shadow: 0 0 0 0.4mm color-mix(in srgb, var(--edit) 55%, transparent); }
.editing [data-k]:focus, .editing .cell:focus { box-shadow: 0 0 0 0.5mm var(--edit); background-color: color-mix(in srgb, var(--edit) 8%, transparent); }

.s-top { display: flex; align-items: center; justify-content: space-between; padding-bottom: 3.2mm; border-bottom: 0.6mm dashed var(--line); }
.s-brand { display: flex; align-items: center; gap: 3mm; }
.s-logo { width: 11mm; height: 11mm; flex: none; object-fit: contain; cursor: pointer; }
.s-brand b { display: block; font-family: "Yangjin", sans-serif; font-weight: 400; font-size: 17pt; line-height: 1.1; }
.s-brand small { display: block; font-size: 7.5pt; letter-spacing: 0.5mm; color: var(--muted); margin-top: 0.8mm; }
.s-booth { text-align: right; }
.s-booth small { display: block; font-size: 7.5pt; color: var(--muted); letter-spacing: 0.5mm; }
.s-booth span { display: inline-block; min-width: 14mm; text-align: center; margin-top: 1mm; font-size: 20pt; line-height: 1; padding: 1.6mm 3mm; background: var(--accent); color: var(--accent-ink); border: 0.6mm solid var(--frame); box-shadow: 1mm 1mm 0 var(--shadow); }
.s-booth span:empty::before { color: var(--accent-ink); }

.s-hero { text-align: center; }
.s-press { display: inline-block; font-size: calc(var(--s) * 10pt); letter-spacing: 0.6mm; padding: 1.6mm 4mm; border: 0.6mm solid var(--accent); color: var(--accent); }
.light .s-press { color: #4d6400; border-color: #4d6400; }
.s-title { font-family: "Yangjin", sans-serif; font-weight: 400; line-height: 1.25; margin: calc(var(--s) * 3.5mm) auto calc(var(--s) * 1.5mm); width: fit-content; max-width: 100%; padding: 0 2mm;
  color: var(--accent); text-shadow: 1.2mm 1.2mm 0 var(--title-shadow); }
.light .s-title { color: var(--ink); }
.s-title:empty::before { text-shadow: none; }
.s-sub { font-size: calc(var(--s) * 12.5pt); color: var(--muted); line-height: 1.5; width: fit-content; max-width: 100%; margin: 0 auto; padding: 0 1mm; }
.s-makers { display: flex; justify-content: center; align-items: center; gap: 2mm; margin-top: calc(var(--s) * 3.5mm); }
.s-makers > small { font-size: calc(var(--s) * 9pt); color: var(--muted); flex: none; }
.s-maker { font-size: calc(var(--s) * 11pt); padding: 1.3mm 3mm; background: var(--panel); border: 0.5mm solid var(--frame); box-shadow: 0.8mm 0.8mm 0 var(--shadow); max-width: 150mm; }

.s-media { display: grid; grid-template-columns: 1.45fr 1fr; gap: 4mm; }
.s-shot { position: relative; border: 0.6mm solid var(--frame); box-shadow: 1.4mm 1.4mm 0 var(--shadow); background: var(--chip); aspect-ratio: 16 / 10; overflow: hidden; }
.s-shot img { width: 100%; height: 100%; object-fit: cover; display: none; }
.s-shot.filled img { display: block; }
.shot-empty { position: absolute; inset: 2mm; border: 0.6mm dashed var(--edit); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2mm; text-align: center; cursor: pointer; color: var(--ink); padding: 3mm; }
.shot-empty b { font-weight: 400; font-size: 13pt; }
.shot-empty small { font-size: 9pt; color: var(--muted); line-height: 1.5; }
.shot-empty .req { font-size: 9pt; padding: 0.8mm 2mm; background: #ff5c7a; color: #fff; }
.shot-empty.drag { background: color-mix(in srgb, var(--edit) 15%, transparent); }
.s-shot.filled .shot-empty { display: none; }
.shot-change { position: absolute; right: 2mm; bottom: 2mm; display: none; cursor: pointer; font: inherit; font-size: 9pt; padding: 1.2mm 2.4mm; background: var(--accent); color: var(--accent-ink); border: 0.5mm solid #000; box-shadow: 0.8mm 0.8mm 0 #000; }
.editing .s-shot.filled:hover .shot-change, .editing .s-shot.filled:focus-within .shot-change { display: block; }
.s-stats { display: grid; grid-template-rows: repeat(3, 1fr); gap: 3mm; }
.s-stat { border: 0.5mm solid var(--frame); background: var(--panel); padding: calc(var(--s) * 2mm) 3mm; display: flex; flex-direction: column; justify-content: center; box-shadow: 0.8mm 0.8mm 0 var(--shadow); }
.s-stat small { font-size: calc(var(--s) * 8pt); color: var(--muted); letter-spacing: 0.3mm; }
.s-stat [data-k] { font-size: calc(var(--s) * 13pt); margin-top: 0.8mm; line-height: 1.3; }

.win { border: 0.6mm solid var(--frame); background: var(--panel); box-shadow: 1.4mm 1.4mm 0 var(--shadow); display: flex; flex-direction: column; }
.win-bar { display: flex; justify-content: space-between; align-items: center; min-height: 7mm; background: var(--line); color: var(--ink); padding: 1mm 2.5mm; font-size: calc(var(--s) * 10pt); border-bottom: 0.6mm solid var(--frame); }
.light .win-bar { background: #e6edd6; }
.win-bar i { font-style: normal; letter-spacing: 1mm; font-size: 8pt; opacity: 0.75; }
.win-body { padding: calc(var(--s) * 3.2mm) 4mm; font-size: calc(var(--s) * 12pt); line-height: 1.7; flex: 1; }
.win.grow { flex: 1 0 auto; }
.win.grow [data-k] { min-height: 100%; }
.win.coin .win-bar { background: var(--accent); color: var(--accent-ink); }
.add-row { display: none; cursor: pointer; font: inherit; font-size: 8.5pt; padding: 0.4mm 2mm; background: var(--panel); color: var(--ink); border: 0.4mm solid var(--frame); }
.editing .add-row { display: inline-block; }
.editing .win-bar i.deco { display: none; }

.s-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 4.5mm; align-items: stretch; }
.rows { display: flex; flex-direction: column; gap: calc(var(--s) * 2.2mm); }
.row { position: relative; display: flex; align-items: center; gap: 2.5mm; }
.row .del { position: absolute; right: -3.2mm; top: 50%; transform: translateY(-50%); display: none; cursor: pointer; font: inherit; font-size: 8pt; line-height: 1; width: 5mm; height: 5mm; padding: 0; background: #ff5c7a; color: #fff; border: 0.4mm solid #000; }
.editing .row:hover .del, .editing .row:focus-within .del { display: block; }
.cap { flex: none; max-width: 48%; min-width: 9mm; text-align: center; padding: 0.8mm 2mm; font-size: calc(var(--s) * 10.5pt); line-height: 1.4;
  background: var(--chip); border: 0.5mm solid var(--frame); box-shadow: 0 0.8mm 0 var(--frame); }
.act { flex: 1; font-size: calc(var(--s) * 11.5pt); line-height: 1.45; }
.coins .row { justify-content: space-between; padding-bottom: calc(var(--s) * 2mm); border-bottom: 0.4mm dashed var(--line); }
.coins .row:last-child { border-bottom: 0; padding-bottom: 0; }
.cond { flex: 1; font-size: calc(var(--s) * 11.5pt); line-height: 1.45; }
.amt { flex: none; display: flex; align-items: center; gap: 1.2mm; font-size: calc(var(--s) * 15pt); white-space: nowrap; }
.amt svg { width: calc(var(--s) * 6mm); height: calc(var(--s) * 6mm); flex: none; }
.amt .cell { min-width: 5mm; text-align: right; white-space: nowrap; }
.coin-note { display: block; margin-top: calc(var(--s) * 2.4mm); font-size: calc(var(--s) * 9.5pt); color: var(--muted); line-height: 1.5; }

.s-foot { display: flex; justify-content: space-between; align-items: center; gap: 4mm; padding-top: 3mm; border-top: 0.6mm dashed var(--line); font-size: 9pt; color: var(--muted); }
.s-foot b { font-weight: 400; color: var(--ink); }

@media (max-width: 700px) {
  .tb-brand { width: 100%; }
  .stage { padding: 18px 16px 50px; }
}

@page { size: A4; margin: 0; }
@media print {
  html, body { background: none !important; margin: 0; }
  .toolbar, .help { display: none !important; }
  .stage { padding: 0; display: block; overflow: visible; }
  .sheet-frame { width: auto !important; height: auto !important; }
  .sheet-scale { position: static; transform: none !important; box-shadow: none; }
  [data-k]:empty::before, .cell:empty::before { content: none; }
  .shot-empty small, .shot-empty b { display: none; }
  .shot-empty .req::after { content: " · 사진 미첨부"; }
  .row.blank { display: none; }
  .s-booth:has(span:empty) { visibility: hidden; }
  .s-stat [data-k]:empty::after { content: "-"; }
}
</style>
</head>
<body>
<header class="toolbar">
  <div class="tb-row">
    <div class="tb-brand"><i>PC</i> 작품 안내 양식</div>
    <div class="tb-group">
      <div class="seg" role="radiogroup" aria-label="색상">
        <label><input type="radio" name="theme" value="dark" />다크 (축제)</label>
        <label><input type="radio" name="theme" value="light" />화이트 (잉크 절약)</label>
      </div>
      <button type="button" class="btn" id="sample">예시 보기</button>
      <button type="button" class="btn" id="reset">모두 지우기</button>
      <button type="button" class="btn primary" id="print">PDF로 저장</button>
    </div>
  </div>
  <div class="tb-info">
    <div class="tb-row">
      <span>안내지의 <b>모든 글자를 클릭해서 고치세요</b> · 로고 클릭 시 이미지 변경 · 줄 추가는 <b>+ 추가</b> 또는 <b>Enter</b></span>
      <span class="fname">파일 이름: <b id="fname">-</b></span>
      <div class="status" id="status"></div>
    </div>
  </div>
</header>

<main class="stage">
  <div class="sheet-frame" id="frame">
    <div class="sheet-scale" id="scale">
      <article class="sheet editing" id="sheet">
        <div class="sheet-inner" id="inner">
          <header class="s-top">
            <div class="s-brand">
              <img class="s-logo" id="logoImg" src="__LOGO__" alt="로고" title="클릭해서 로고 바꾸기" />
              <div><b data-k="brandTitle" data-max="30"></b><small data-k="brandSub" data-max="50"></small></div>
            </div>
            <div class="s-booth"><small data-k="boothLabel" data-max="12"></small><span data-k="booth" data-ph="00" data-max="6"></span></div>
          </header>

          <section class="s-hero">
            <div class="s-press" data-k="press" data-max="40"></div>
            <h1 class="s-title" data-k="title" data-ph="작품명" data-max="40"></h1>
            <div class="s-sub" data-k="subtitle" data-ph="한 줄 소개를 적어 주세요" data-max="60"></div>
            <div class="s-makers"><small data-k="makerLabel" data-max="12"></small><span class="s-maker" data-k="makers" data-ph="20301 김민준, 20315 이서연" data-max="80"></span></div>
          </section>

          <section class="s-media">
            <div class="s-shot" id="shotBox">
              <img id="shotImg" alt="게임 화면" />
              <div class="shot-empty" id="shotEmpty" role="button" tabindex="0">
                <span class="req">필수</span>
                <b>📷 클릭해서 게임 화면 사진 넣기</b>
                <small>사진 파일을 여기로 끌어다 놓아도 돼요</small>
              </div>
              <button type="button" class="shot-change" id="shotChange">사진 바꾸기</button>
            </div>
            <div class="s-stats">
              <div class="s-stat"><small data-k="genreLabel" data-max="20"></small><div data-k="genre" data-ph="예) 아케이드" data-max="16"></div></div>
              <div class="s-stat"><small data-k="playersLabel" data-max="20"></small><div data-k="players" data-ph="예) 1인용" data-max="16"></div></div>
              <div class="s-stat"><small data-k="timeLabel" data-max="20"></small><div data-k="playtime" data-ph="예) 약 1분 30초" data-max="16"></div></div>
            </div>
          </section>

          <section class="win grow">
            <div class="win-bar"><span data-k="winDesc" data-max="24"></span><i class="deco">_□×</i></div>
            <div class="win-body"><div data-k="desc" data-multi data-ph="어떤 게임인지, 어떻게 이기는지 적어 주세요. (Enter로 줄 바꿈)"></div></div>
          </section>

          <section class="s-cols">
            <div class="win">
              <div class="win-bar"><span data-k="winKeys" data-max="24"></span><i class="deco">_□×</i><button type="button" class="add-row" data-add="controls">+ 추가</button></div>
              <div class="win-body"><div class="rows keys" id="controls"></div></div>
            </div>
            <div class="win coin">
              <div class="win-bar"><span data-k="winCoin" data-max="24"></span><i class="deco">_□×</i><button type="button" class="add-row" data-add="coins">+ 추가</button></div>
              <div class="win-body"><div class="rows coins" id="coins"></div><span class="coin-note" data-k="coinNote" data-ph="예) 1인 1회 · 운영자 확인 후 지급" data-max="70"></span></div>
            </div>
          </section>

          <footer class="s-foot">
            <span data-k="footL" data-max="60"></span>
            <span data-k="footR" data-max="40"></span>
          </footer>
        </div>
      </article>
    </div>
  </div>

  <section class="help">
    <b>PDF 저장 방법 (크롬·엣지)</b> — 입력 내용은 이 브라우저에 자동 저장돼요.
    <ol>
      <li>위의 <b>PDF로 저장</b> 클릭 → 대상(프린터) <b>PDF로 저장</b></li>
      <li>용지 크기 <b>A4</b>, 여백 <b>없음</b>, 설정 더보기 → <b>배경 그래픽</b> 체크</li>
      <li>저장한 PDF를 드라이브에 업로드</li>
    </ol>
  </section>
</main>
<input type="file" id="shotFile" accept="image/*" hidden />
<input type="file" id="logoFile" accept="image/*" hidden />

<script>
(() => {
  const STORE = "pcclub.workcard.v2";
  const SAMPLE = {
    title: "핀볼 게임", subtitle: "공을 떨어뜨리지 말고 끝까지 버텨라!", makers: "20301 김민준, 20315 이서연",
    booth: "07", genre: "아케이드", players: "1인용", playtime: "약 1분 30초",
    desc: "공을 쏘아 올려 장애물을 맞히고 고득점을 노리는 핀볼 게임입니다.\n공이 아래로 떨어지면 목숨이 하나 줄어들고, 목숨 3개를 모두 잃으면 게임 오버!",
    controls: [{ k: "SPACE", v: "공 발사 (길게 누를수록 세게)" }, { k: "← / →", v: "왼쪽·오른쪽 플리퍼" }, { k: "R", v: "다시 시작" }],
    coins: [{ k: "1000점 이상", v: "1" }, { k: "2000점 이상", v: "2" }, { k: "3000점 이상", v: "3" }],
    coinNote: "1인 1회 · 운영자가 점수 확인 후 지급",
    theme: "dark", shot: ""
  };
  const EMPTY = { title: "", subtitle: "", makers: "", booth: "", genre: "", players: "", playtime: "", desc: "",
    controls: [{ k: "", v: "" }, { k: "", v: "" }], coins: [{ k: "", v: "" }, { k: "", v: "" }], coinNote: "", theme: "dark", shot: "" };
  const DEF = {
    brandTitle: "PC CLUB", brandSub: "FESTIVAL EDITION · GAME BOOTH", boothLabel: "BOOTH", press: "▶ INSERT COIN · PRESS START",
    makerLabel: "만든 사람", genreLabel: "GENRE · 장르", playersLabel: "PLAYER · 인원", timeLabel: "TIME · 한 판",
    winDesc: "■ 설명.TXT", winKeys: "■ 조작방법.KEY", winCoin: "● 코인지급.COIN",
    footL: "획득한 코인은 PC CLUB 키오스크에서 받아 가세요", footR: "★ GAME OVER? TRY AGAIN!"
  };
  const keepLabels = () => Object.fromEntries(Object.keys(DEF).map((k) => [k, state[k] ?? DEF[k]]).concat([["logo", state.logo || ""]]));
  const PH = { controls: ["키", "하는 일"], coins: ["조건 (예: 1000점 이상)", "0"] };
  const COIN_SVG = '<svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#7a5c00" d="M2 0h4v1h1v1h1v4H7v1H6v1H2V7H1V6H0V2h1V1h1z"/><path fill="#ffd23f" d="M2 1h4v1h1v4H6v1H2V6H1V2h1z"/><path fill="#fff3b0" d="M2 2h1v3H2z"/><path fill="#b88a00" d="M4 2h1v4H4z"/></svg>';
  const $ = (id) => document.getElementById(id);
  const sheet = $("sheet"), inner = $("inner");
  const clone = (o) => JSON.parse(JSON.stringify(o));
  let state = load();

  function load() {
    try { const raw = localStorage.getItem(STORE); if (raw) return { ...clone(EMPTY), ...JSON.parse(raw) }; } catch (e) {}
    return clone(SAMPLE);
  }
  let saveTimer;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(STORE, JSON.stringify(state)); }
      catch (e) { try { localStorage.setItem(STORE, JSON.stringify({ ...state, shot: "" })); } catch (e2) {} }
    }, 250);
  }

  /* ---- editable helpers ---- */
  const textOf = (n) => (n.innerText || "").replace(/ /g, " ").replace(/\n$/, "");
  function makeEditable(n) {
    n.contentEditable = "plaintext-only";
    if (n.contentEditable !== "plaintext-only") n.contentEditable = "true";
    n.spellcheck = false;
    n.addEventListener("paste", (e) => {
      e.preventDefault();
      let t = (e.clipboardData || window.clipboardData).getData("text") || "";
      if (!n.hasAttribute("data-multi")) t = t.replace(/\s*\n\s*/g, " ");
      document.execCommand("insertText", false, t);
    });
    n.addEventListener("drop", (e) => { if (!e.dataTransfer.files.length) return; e.preventDefault(); });
  }
  function setText(n, v) { n.textContent = v || ""; }
  function clean(n) { if (!textOf(n).trim() && n.childNodes.length) n.textContent = ""; }
  function limit(n) {
    const max = Number(n.dataset.max || 0);
    if (max && textOf(n).length > max) { n.textContent = textOf(n).slice(0, max); placeCaretEnd(n); }
  }
  function placeCaretEnd(n) {
    n.focus();
    const r = document.createRange(); r.selectNodeContents(n); r.collapse(false);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  const focusables = () => [...inner.querySelectorAll("[data-k], .cell")];
  function focusNext(n, dir = 1) {
    const list = focusables(), i = list.indexOf(n), t = list[i + dir];
    if (t) placeCaretEnd(t);
  }

  /* ---- simple fields ---- */
  document.querySelectorAll("[data-k]").forEach((n) => {
    makeEditable(n);
    n.addEventListener("input", () => { clean(n); limit(n); state[n.dataset.k] = textOf(n); changed(); });
    n.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !n.hasAttribute("data-multi") && !e.isComposing) { e.preventDefault(); focusNext(n, 1); }
    });
  });

  /* ---- row lists (controls / coins) ---- */
  function buildRows(key) {
    const box = $(key);
    box.replaceChildren(...state[key].map((r, i) => rowEl(key, r, i)));
  }
  function rowEl(key, r, i) {
    const row = document.createElement("div");
    row.className = "row";
    const a = document.createElement("span"), b = document.createElement("span");
    a.className = "cell " + (key === "controls" ? "cap" : "cond");
    b.className = "cell " + (key === "controls" ? "act" : "");
    a.dataset.ph = PH[key][0]; b.dataset.ph = PH[key][1];
    a.dataset.max = key === "controls" ? 16 : 30; b.dataset.max = key === "controls" ? 40 : 8;
    setText(a, r.k); setText(b, r.v);
    row.classList.toggle("blank", !(r.k || "").trim() && !(r.v || "").trim());
    [a, b].forEach((n, col) => {
      makeEditable(n);
      n.addEventListener("input", () => {
        clean(n); limit(n);
        const idx = [...row.parentNode.children].indexOf(row);
        state[key][idx][col ? "v" : "k"] = textOf(n);
        row.classList.toggle("blank", !textOf(a).trim() && !textOf(b).trim());
        changed();
      });
      n.addEventListener("keydown", (e) => {
        if (e.isComposing) return;
        const idx = [...row.parentNode.children].indexOf(row);
        if (e.key === "Enter") {
          e.preventDefault();
          if (col === 0) return placeCaretEnd(b);
          addRow(key, idx + 1);
        } else if (e.key === "Backspace" && !textOf(a) && !textOf(b) && state[key].length > 1) {
          e.preventDefault();
          removeRow(key, idx, true);
        }
      });
    });
    if (key === "coins") {
      const amt = document.createElement("span");
      amt.className = "amt"; amt.innerHTML = COIN_SVG;
      amt.append(b, document.createTextNode(" 코인"));
      row.append(a, amt);
    } else row.append(a, b);
    const del = document.createElement("button");
    del.type = "button"; del.className = "del"; del.textContent = "×"; del.title = "이 줄 삭제"; del.contentEditable = "false";
    del.addEventListener("click", () => removeRow(key, [...row.parentNode.children].indexOf(row), false));
    row.append(del);
    return row;
  }
  function addRow(key, at) {
    if (state[key].length >= 8) return status("줄은 최대 8개까지 넣을 수 있어요.", true);
    state[key].splice(at, 0, { k: "", v: "" });
    buildRows(key);
    placeCaretEnd($(key).children[at].querySelector(".cell"));
    changed();
  }
  function removeRow(key, idx, focusPrev) {
    if (state[key].length <= 1) { state[key][0] = { k: "", v: "" }; }
    else state[key].splice(idx, 1);
    buildRows(key);
    const rows = $(key).children, t = rows[Math.max(0, idx - 1)];
    if (focusPrev && t) placeCaretEnd(t.querySelectorAll(".cell")[1]);
    changed();
  }
  document.querySelectorAll("[data-add]").forEach((btn) => btn.addEventListener("click", () => addRow(btn.dataset.add, state[btn.dataset.add].length)));

  /* ---- photo (required) ---- */
  const fileIn = $("shotFile");
  const pick = () => fileIn.click();
  $("shotEmpty").addEventListener("click", pick);
  $("shotEmpty").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
  $("shotChange").addEventListener("click", pick);
  fileIn.addEventListener("change", () => { if (fileIn.files[0]) loadImage(fileIn.files[0]); fileIn.value = ""; });
  const box = $("shotBox");
  ["dragenter", "dragover"].forEach((t) => box.addEventListener(t, (e) => { e.preventDefault(); $("shotEmpty").classList.add("drag"); }));
  ["dragleave", "drop"].forEach((t) => box.addEventListener(t, () => $("shotEmpty").classList.remove("drag")));
  box.addEventListener("drop", (e) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) loadImage(f); });
  function loadImage(file) {
    if (!/^image\//.test(file.type)) return status("이미지 파일(PNG, JPG 등)만 넣을 수 있어요.", true);
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const r = Math.min(1, 1400 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        const ctx = c.getContext("2d"); ctx.fillStyle = "#000"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        state.shot = c.toDataURL("image/jpeg", 0.88);
        showShot(); changed();
      };
      img.onerror = () => status("이 사진은 열 수 없어요. 다른 파일을 넣어 주세요.", true);
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  function showShot() {
    box.classList.toggle("filled", !!state.shot);
    if (state.shot) $("shotImg").src = state.shot; else $("shotImg").removeAttribute("src");
  }

  /* ---- logo ---- */
  const LOGO = $("logoImg").getAttribute("src");
  $("logoImg").addEventListener("click", () => $("logoFile").click());
  $("logoFile").addEventListener("change", () => {
    const f = $("logoFile").files[0]; $("logoFile").value = "";
    if (!f || !/^image\//.test(f.type)) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const r = Math.min(1, 400 / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        state.logo = c.toDataURL("image/png"); $("logoImg").src = state.logo; changed();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  });

  /* ---- render / fit ---- */
  function fill() {
    document.querySelectorAll("[data-k]").forEach((n) => { if (n.dataset.k in DEF && !n.dataset.ph) n.dataset.ph = DEF[n.dataset.k]; setText(n, state[n.dataset.k] ?? DEF[n.dataset.k]); });
    $("logoImg").src = state.logo || LOGO;
    buildRows("controls"); buildRows("coins");
    showShot();
    document.querySelectorAll('input[name="theme"]').forEach((r) => { r.checked = r.value === state.theme; });
    changed();
  }
  function changed() {
    sheet.classList.toggle("light", state.theme === "light");
    const t = sheet.querySelector(".s-title");
    const len = [...(state.title || "작품명")].length;
    t.dataset.base = len <= 5 ? 50 : len <= 8 ? 42 : len <= 12 ? 34 : len <= 18 ? 27 : 22;
    const who = (state.makers.split(/[,·\n]/)[0] || "").replace(/\s+/g, "") || "학번이름";
    const fname = `${who}_${(state.title || "작품명").replace(/[\\/:*?"<>|\s]+/g, "")}`;
    $("fname").textContent = fname + ".pdf";
    document.title = fname;
    fit(); save();
  }
  function fit() {
    const t = sheet.querySelector(".s-title");
    const over = () => inner.scrollHeight > inner.clientHeight + 1;
    let s = 1;
    const apply = () => { sheet.style.setProperty("--s", s); t.style.fontSize = (Number(t.dataset.base) * Math.min(1, s + 0.1)) + "pt"; };
    apply();
    while (over() && s > 0.66) { s = Math.round((s - 0.03) * 100) / 100; apply(); }
    if (over()) status("글이 너무 길어서 한 장에 다 들어가지 않아요. 설명이나 조작방법을 조금 줄여 주세요.", true);
    else status("");
  }
  let stTimer;
  function status(msg, temp) {
    const n = $("status");
    n.textContent = msg; n.classList.toggle("show", !!msg);
    clearTimeout(stTimer);
    if (msg && temp && !/한 장에/.test(msg)) stTimer = setTimeout(() => status(""), 3500);
  }
  function scalePreview() {
    const frame = $("frame"), sc = $("scale");
    const w = sheet.offsetWidth, h = sheet.offsetHeight;
    const avail = Math.max(200, frame.parentElement.clientWidth - 32);
    const k = Math.min(1, avail / w);
    sc.style.transform = `scale(${k})`;
    frame.style.width = w * k + "px"; frame.style.height = h * k + "px";
  }

  /* ---- toolbar ---- */
  document.querySelectorAll('input[name="theme"]').forEach((r) => r.addEventListener("change", () => { state.theme = r.value; changed(); }));
  const hasContent = () => ["title", "subtitle", "makers", "desc", "genre", "shot"].some((k) => state[k]) || state.controls.some((r) => r.k || r.v);
  $("sample").addEventListener("click", () => {
    if (hasContent() && !confirm("지금 쓴 내용을 예시로 바꿀까요?")) return;
    state = { ...clone(SAMPLE), ...keepLabels(), theme: state.theme }; fill();
  });
  $("reset").addEventListener("click", () => {
    if (!confirm("입력한 내용과 사진을 모두 지울까요?")) return;
    state = { ...clone(EMPTY), ...keepLabels(), theme: state.theme }; fill();
  });
  $("print").addEventListener("click", () => {
    if (!state.shot) {
      status("게임 화면 사진은 필수예요. 사진 칸을 클릭해서 넣어 주세요.", true);
      box.scrollIntoView({ behavior: "smooth", block: "center" });
      $("shotEmpty").focus();
      return;
    }
    const filled = (rows) => rows.some((r) => r.k.trim() && r.v.trim());
    const missing = [
      [!state.title.trim(), "작품명"], [!state.makers.trim(), "만든 사람"], [!state.desc.trim(), "설명"],
      [!filled(state.controls), "조작방법"], [!filled(state.coins), "코인 지급"]
    ].filter(([m]) => m).map(([, n]) => n);
    if (missing.length && !confirm(`아직 비어 있어요: ${missing.join(", ")}\n그래도 저장할까요?`)) return;
    if (document.activeElement) document.activeElement.blur();
    window.print();
  });
  window.addEventListener("beforeprint", () => sheet.classList.remove("editing"));
  window.addEventListener("afterprint", () => sheet.classList.add("editing"));

  window.addEventListener("resize", scalePreview);
  fill();
  scalePreview();
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(); scalePreview(); });
})();
</script>
</body>
</html>
